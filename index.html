<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BACTERIA | Best Editing Software</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal active">
        <div class="modal-content">
            <h1 class="logo">BACTERIA<span class="accent">.exe</span></h1>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">LOGIN</button>
                <button class="tab-btn" onclick="switchTab('signup')">SIGN UP</button>
            </div>
            <form id="login-form">
                <input type="text" placeholder="USERNAME" class="input-field">
                <input type="password" placeholder="PASSWORD" class="input-field">
                <button type="submit" class="neon-btn">ENTER SYSTEM</button>
            </form>
            <form id="signup-form" style="display:none;">
                <input type="text" placeholder="NEW USERNAME" class="input-field">
                <input type="email" placeholder="EMAIL" class="input-field">
                <input type="password" placeholder="PASSWORD" class="input-field">
                <button type="submit" class="neon-btn">REGISTER</button>
            </form>
        </div>
    </div>

    <!-- Main Editor UI -->
    <div id="editor-ui" style="display:none;">
        <header>
            <div class="logo-small">BACTERIA</div>
            <div class="user-info">USER: <span id="username-display">GUEST</span></div>
            <div class="controls">
                <button onclick="document.getElementById('video-upload').click()" class="btn-secondary">IMPORT VIDEO</button>
                <input type="file" id="video-upload" accept="video/*" style="display:none">
                <button onclick="saveProject()" class="neon-btn">SAVE .BACTERIA</button>
                <button onclick="document.getElementById('project-load').click()" class="btn-secondary">LOAD</button>
                <input type="file" id="project-load" accept=".bacteria" style="display:none">
                <button onclick="logout()" class="btn-danger">LOGOUT</button>
            </div>
        </header>

        <main>
            <div class="viewport">
                <canvas id="preview-canvas"></canvas>
                <div class="overlay-info">
                    <span id="timecode">00:00:00</span>
                    <span id="fps-counter">60 FPS</span>
                </div>
            </div>

            <div class="sidebar">
                <h3>EFFECTS LIBRARY (50+)</h3>
                <div class="effects-grid" id="effects-list">
                    <!-- Populated by JS -->
                </div>
            </div>
        </main>

        <div class="timeline-container">
            <div class="timeline-controls">
                <button onclick="togglePlay()" id="play-btn">PLAY</button>
                <button onclick="stopVideo()">STOP</button>
                <input type="range" id="seek-bar" value="0" min="0" max="100">
            </div>
            <div class="timeline-track" id="timeline">
                <!-- Effect blocks go here -->
            </div>
        </div>
    </div>

    <script src="effects.js"></script>
    <script src="editor.js"></script>
</body>
</html>
